name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # Pages 只需要混淆器，跳过 electron 的二进制下载
      - name: Install protection tooling
        run: npm install --include=dev --no-omit --ignore-scripts

      - name: Obfuscate game source
        run: npm run protect

      - name: Upload static site (obfuscated)
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./build-protected/app

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
